[project]
name = "aie2026-exercises"
version = "0.1.0"
description = "Repositorio de ejercicios y tareas de AIE2026 (desarrollar un agente de apoyo al aprendizaje)"
readme = "README.md"
requires-python = ">=3.12"
# Versiones fijadas para evitar fallos durante el año del curso
dependencies = [
    "google-genai==2.31.0",
    "pydantic-ai-slim[google,mcp]==2.57.0",  # mcp se usa en Lecture 05 (servidores y clientes MCP)
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:pydantic_graph"]
